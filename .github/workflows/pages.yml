name: Deploy book to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build bilingual site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MDBOOK_VERSION: "0.5.2"
      MDBOOK_SHA256: "084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d"
      MDBOOK_OUTPUT__PDF__OPTIONAL: "true"
    steps:
      - name: Check out the publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned mdBook
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="$RUNNER_TEMP/botnana-pages-tools"
          mdbook_archive="$RUNNER_TEMP/mdbook.tar.gz"
          mkdir -p "$tool_dir"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$mdbook_archive"
          echo "$MDBOOK_SHA256  $mdbook_archive" | sha256sum --check --strict
          tar -xzf "$mdbook_archive" -C "$tool_dir" mdbook

          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Verify mdBook version
        run: '[[ $(mdbook --version) == "mdbook v${MDBOOK_VERSION}" ]]'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Test the Pages workflow contract
        run: |
          bash tests/test-pages-workflow.bash
          node tests/test-language-switch.js

      - name: Build the current books
        shell: bash
        run: |
          set -euo pipefail

          pages_build_root="$RUNNER_TEMP/botnana-pages-build"
          pages_artifact="$RUNNER_TEMP/botnana-pages-artifact"
          chinese_site="$pages_build_root/zh-tw/html"
          english_site="$pages_build_root/en-us/html"

          mdbook build zh-tw --dest-dir "$pages_build_root/zh-tw"
          mdbook build en-us --dest-dir "$pages_build_root/en-us"

          mkdir -p "$pages_artifact/en-us"
          cp -a "$chinese_site/." "$pages_artifact/"
          cp -a "$english_site/." "$pages_artifact/en-us/"

          test -f "$pages_artifact/index.html"
          test -f "$pages_artifact/en-us/index.html"
          grep -Fq 'lang="zh-TW"' "$pages_artifact/index.html"
          grep -Fq 'lang="en"' "$pages_artifact/en-us/index.html"
          grep -Fq 'Botnana BN-B3A' "$pages_artifact/bn-b3a.html"
          grep -Fq 'Botnana BN-B3A' "$pages_artifact/en-us/bn-b3a.html"
          grep -Eq 'language-switch-[[:xdigit:]]+\.js' "$pages_artifact/index.html"
          grep -Eq 'language-switch-[[:xdigit:]]+\.js' "$pages_artifact/en-us/index.html"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/botnana-pages-artifact

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
