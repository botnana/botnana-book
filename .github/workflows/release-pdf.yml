name: Build release PDFs

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

concurrency:
  group: release-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MDBOOK_VERSION: "0.5.2"
      MDBOOK_SHA256: "084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d"
      MDBOOK_PDF_VERSION: "0.1.13"
      MDBOOK_PDF_SHA256: "78926f96540add76d8dd035d683b01bee01844229544c129e04a7bc4c30a5cbb"
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned mdBook renderers
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="$RUNNER_TEMP/botnana-book-tools"
          mdbook_archive="$RUNNER_TEMP/mdbook.tar.gz"
          mdbook_pdf_download="$RUNNER_TEMP/mdbook-pdf"
          mkdir -p "$tool_dir"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$mdbook_archive"
          echo "$MDBOOK_SHA256  $mdbook_archive" | sha256sum --check --strict
          tar -xzf "$mdbook_archive" -C "$tool_dir" mdbook

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/HollowMan6/mdbook-pdf/releases/download/v${MDBOOK_PDF_VERSION}/mdbook-pdf-v${MDBOOK_PDF_VERSION}-x86_64-unknown-linux-gnu" \
            --output "$mdbook_pdf_download"
          echo "$MDBOOK_PDF_SHA256  $mdbook_pdf_download" | sha256sum --check --strict
          install -m 0755 "$mdbook_pdf_download" "$tool_dir/mdbook-pdf"

          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Verify renderer prerequisites
        shell: bash
        run: |
          set -euo pipefail

          [[ $(mdbook --version) == "mdbook v${MDBOOK_VERSION}" ]]
          command -v mdbook-pdf
          google-chrome --version

      - name: Verify tag matches both covers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_version=${RELEASE_TAG#v}
          expected_cover_version="### Version $release_version"
          for cover in en-us/src/cover.md zh-tw/src/cover.md; do
            grep -Fx -- "$expected_cover_version" "$cover"
          done

      - name: Test the publication script
        run: |
          bash tests/test-build-book.bash
          bash tests/test-release-workflow.bash

      - name: Build both PDF editions
        run: ./build-book.bash

      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botnana-book-pdfs
          path: |
            botnana-book_en-us.pdf
            botnana-book_zh-tw.pdf
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified PDFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: botnana-book-pdfs
          path: release-assets

      - name: Create and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          repository="$GITHUB_REPOSITORY"
          english_pdf="release-assets/botnana-book_en-us.pdf"
          chinese_pdf="release-assets/botnana-book_zh-tw.pdf"
          [[ -s $english_pdf ]]
          [[ -s $chinese_pdf ]]

          if gh release view "$RELEASE_TAG" --repo "$repository" > /dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "$repository" \
              --json isDraft --jq .isDraft)
            [[ $is_draft == true ]] || {
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" --repo "$repository" --clobber \
              "$english_pdf" "$chinese_pdf"
          else
            gh release create "$RELEASE_TAG" --repo "$repository" --verify-tag \
              --title "Botnana Control Manual $RELEASE_TAG" \
              --draft --generate-notes "$english_pdf" "$chinese_pdf"
          fi

          gh release edit "$RELEASE_TAG" --repo "$repository" --draft=false --latest
